<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyberShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cyberLockGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Slate Plate -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#cyberBg)" stroke="#1E293B" stroke-width="2" />

  <!-- Shield & Lock Security Icon -->
  <g filter="url(#cyberGlow)">
    <!-- Shield Outer Contour -->
    <path fill="url(#cyberShieldGrad)" opacity="0.2" d="M64 18 L100 32 C100 68 86 92 64 106 C42 92 28 68 28 32 Z" />
    <path fill="none" stroke="url(#cyberShieldGrad)" stroke-width="3.5" stroke-linejoin="round" d="M64 18 L100 32 C100 68 86 92 64 106 C42 92 28 68 28 32 Z" />

    <!-- Inner Shield Accent -->
    <path fill="none" stroke="url(#cyberCyan)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" d="M64 26 L92 37 C92 65 80 84 64 96 C48 84 36 65 36 37 Z" />

    <!-- Padlock Shackle -->
    <path fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" d="M52 56 V47 C52 40.4 57.4 35 64 35 C70.6 35 76 40.4 76 47 V56" />

    <!-- Padlock Body -->
    <rect x="44" y="56" width="40" height="30" rx="7" fill="url(#cyberLockGold)" stroke="#D97706" stroke-width="1.5" />

    <!-- Keyhole & Cyber Core -->
    <circle cx="64" cy="68" r="4" fill="#090D16" />
    <polygon points="61.5,69 66.5,69 65.5,77 62.5,77" fill="#090D16" />

    <!-- Cyber Circuit Nodes -->
    <line x1="64" y1="18" x2="64" y2="26" stroke="#38BDF8" stroke-width="2" />
    <circle cx="64" cy="26" r="2" fill="#38BDF8" />
    <line x1="28" y1="32" x2="36" y2="37" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="36" cy="37" r="1.8" fill="#38BDF8" />
    <line x1="100" y1="32" x2="92" y2="37" stroke="#38BDF8" stroke-width="1.8" />
    <circle cx="92" cy="37" r="1.8" fill="#38BDF8" />
  </g>
</svg>
