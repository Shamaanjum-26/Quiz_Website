<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="aiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1035" />
      <stop offset="100%" stop-color="#0F081D" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#A855F7" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Violet Plate -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#aiBg)" stroke="#4C1D95" stroke-width="2" />

  <!-- Neural Network / AI Architecture -->
  <g filter="url(#nodeGlow)">
    <!-- Neural Synapse Connections -->
    <!-- Input layer to Hidden layer 1 -->
    <line x1="32" y1="42" x2="54" y2="34" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="32" y1="42" x2="54" y2="64" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="32" y1="64" x2="54" y2="34" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="32" y1="64" x2="54" y2="64" stroke="#8B5CF6" stroke-width="2.5" />
    <line x1="32" y1="64" x2="54" y2="94" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="32" y1="86" x2="54" y2="64" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="32" y1="86" x2="54" y2="94" stroke="#6D28D9" stroke-width="2.2" />

    <!-- Hidden layer 1 to Hidden layer 2 -->
    <line x1="54" y1="34" x2="74" y2="44" stroke="#8B5CF6" stroke-width="2.2" />
    <line x1="54" y1="34" x2="74" y2="84" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="54" y1="64" x2="74" y2="44" stroke="#A855F7" stroke-width="2.5" />
    <line x1="54" y1="64" x2="74" y2="84" stroke="#A855F7" stroke-width="2.5" />
    <line x1="54" y1="94" x2="74" y2="44" stroke="#6D28D9" stroke-width="2.2" />
    <line x1="54" y1="94" x2="74" y2="84" stroke="#8B5CF6" stroke-width="2.2" />

    <!-- Hidden layer 2 to Output Layer -->
    <line x1="74" y1="44" x2="96" y2="54" stroke="#C084FC" stroke-width="2.5" />
    <line x1="74" y1="44" x2="96" y2="74" stroke="#8B5CF6" stroke-width="2.2" />
    <line x1="74" y1="84" x2="96" y2="54" stroke="#8B5CF6" stroke-width="2.2" />
    <line x1="74" y1="84" x2="96" y2="74" stroke="#C084FC" stroke-width="2.5" />

    <!-- Central Tensor Core / Brain Spark -->
    <circle cx="64" cy="64" r="14" fill="#581C87" opacity="0.4" />
    <circle cx="64" cy="64" r="8" fill="none" stroke="#C084FC" stroke-width="1.8" stroke-dasharray="2 2" />

    <!-- Layer 1 Nodes (Input) -->
    <circle cx="32" cy="42" r="5" fill="#38BDF8" />
    <circle cx="32" cy="64" r="6" fill="#38BDF8" />
    <circle cx="32" cy="86" r="5" fill="#38BDF8" />

    <!-- Layer 2 Nodes (Hidden 1) -->
    <circle cx="54" cy="34" r="5.5" fill="url(#purpleGlow)" />
    <circle cx="54" cy="64" r="7" fill="#E879F9" />
    <circle cx="54" cy="94" r="5.5" fill="url(#purpleGlow)" />

    <!-- Layer 3 Nodes (Hidden 2) -->
    <circle cx="74" cy="44" r="6.5" fill="#F472B6" />
    <circle cx="74" cy="84" r="6.5" fill="#F472B6" />

    <!-- Layer 4 Nodes (Output: AI Prediction) -->
    <circle cx="96" cy="54" r="6" fill="#FBBF24" />
    <circle cx="96" cy="74" r="6" fill="#34D399" />
  </g>
</svg>
